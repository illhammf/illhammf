<svg width="1200" height="120" viewBox="0 0 1200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="titleLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <style>
      .track {
        animation: marquee 26s linear infinite;
      }
      .track2 {
        animation: marquee2 26s linear infinite;
      }
      .pill {
        filter: url(#shadow);
      }
      .label {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #E5E7EB;
      }
      .small {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #94A3B8;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-1210px); }
      }
      @keyframes marquee2 {
        0% { transform: translateX(1210px); }
        100% { transform: translateX(0); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="1180" height="100" rx="24" fill="url(#bg)"/>
  <rect x="10" y="10" width="1180" height="100" rx="24" stroke="#1F2937"/>
  <rect x="30" y="32" width="220" height="4" rx="2" fill="url(#titleLine)" opacity="0.9"/>
  <text x="30" y="28" class="small">TECH STACK • SCROLLING MARQUEE</text>

  <!-- Viewport -->
  <clipPath id="clip">
    <rect x="20" y="40" width="1160" height="52" rx="18"/>
  </clipPath>

  <g clip-path="url(#clip)">
    <!-- Track 1 -->
    <g class="track">
      <!-- Python -->
      <g class="pill" transform="translate(40 48)">
        <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="60" y="24" text-anchor="middle" class="label">Python</text>
      </g>

      <!-- Java -->
      <g class="pill" transform="translate(180 48)">
        <rect width="100" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="50" y="24" text-anchor="middle" class="label">Java</text>
      </g>

      <!-- C -->
      <g class="pill" transform="translate(300 48)">
        <rect width="70" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="35" y="24" text-anchor="middle" class="label">C</text>
      </g>

      <!-- C++ -->
      <g class="pill" transform="translate(390 48)">
        <rect width="90" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="45" y="24" text-anchor="middle" class="label">C++</text>
      </g>

      <!-- C# -->
      <g class="pill" transform="translate(500 48)">
        <rect width="80" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="40" y="24" text-anchor="middle" class="label">C#</text>
      </g>

      <!-- Docker -->
      <g class="pill" transform="translate(600 48)">
        <rect width="110" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="55" y="24" text-anchor="middle" class="label">Docker</text>
      </g>

      <!-- Git -->
      <g class="pill" transform="translate(730 48)">
        <rect width="80" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="40" y="24" text-anchor="middle" class="label">Git</text>
      </g>

      <!-- GitHub -->
      <g class="pill" transform="translate(830 48)">
        <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="60" y="24" text-anchor="middle" class="label">GitHub</text>
      </g>

      <!-- VS Code -->
      <g class="pill" transform="translate(970 48)">
        <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="60" y="24" text-anchor="middle" class="label">VS Code</text>
      </g>

      <!-- Linux -->
      <g class="pill" transform="translate(1110 48)">
        <rect width="100" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="50" y="24" text-anchor="middle" class="label">Linux</text>
      </g>

      <!-- Windows -->
      <g class="pill" transform="translate(1230 48)">
        <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="60" y="24" text-anchor="middle" class="label">Windows</text>
      </g>

      <!-- Nginx -->
      <g class="pill" transform="translate(1370 48)">
        <rect width="110" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="55" y="24" text-anchor="middle" class="label">Nginx</text>
      </g>
    </g>

    <!-- Track 2 -->
    <g class="track2">
      <!-- Python -->
      <g class="pill" transform="translate(40 48)">
        <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="60" y="24" text-anchor="middle" class="label">Python</text>
      </g>

      <!-- Java -->
      <g class="pill" transform="translate(180 48)">
        <rect width="100" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="50" y="24" text-anchor="middle" class="label">Java</text>
      </g>

      <!-- C -->
      <g class="pill" transform="translate(300 48)">
        <rect width="70" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="35" y="24" text-anchor="middle" class="label">C</text>
      </g>

      <!-- C++ -->
      <g class="pill" transform="translate(390 48)">
        <rect width="90" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="45" y="24" text-anchor="middle" class="label">C++</text>
      </g>

      <!-- C# -->
      <g class="pill" transform="translate(500 48)">
        <rect width="80" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="40" y="24" text-anchor="middle" class="label">C#</text>
      </g>

      <!-- Docker -->
      <g class="pill" transform="translate(600 48)">
        <rect width="110" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="55" y="24" text-anchor="middle" class="label">Docker</text>
      </g>

      <!-- Git -->
      <g class="pill" transform="translate(730 48)">
        <rect width="80" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="40" y="24" text-anchor="middle" class="label">Git</text>
      </g>

      <!-- GitHub -->
      <g class="pill" transform="translate(830 48)">
        <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="60" y="24" text-anchor="middle" class="label">GitHub</text>
      </g>

      <!-- VS Code -->
      <g class="pill" transform="translate(970 48)">
        <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="60" y="24" text-anchor="middle" class="label">VS Code</text>
      </g>

      <!-- Linux -->
      <g class="pill" transform="translate(1110 48)">
        <rect width="100" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="50" y="24" text-anchor="middle" class="label">Linux</text>
      </g>

      <!-- Windows -->
      <g class="pill" transform="translate(1230 48)">
        <rect width="120" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="60" y="24" text-anchor="middle" class="label">Windows</text>
      </g>

      <!-- Nginx -->
      <g class="pill" transform="translate(1370 48)">
        <rect width="110" height="36" rx="18" fill="#1E293B" stroke="#334155"/>
        <text x="55" y="24" text-anchor="middle" class="label">Nginx</text>
      </g>
    </g>
  </g>
</svg>
