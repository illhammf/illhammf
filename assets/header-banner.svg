<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22C55E" flood-opacity="0.25"/>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>

    <style>
      .title {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: #F8FAFC;
        letter-spacing: 1px;
      }
      .subtitle {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #CBD5E1;
      }
      .desc {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 17px;
        font-weight: 500;
        fill: #94A3B8;
      }
      .terminalText {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 16px;
        fill: #E2E8F0;
      }
      .muted {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 15px;
        fill: #94A3B8;
      }
      .cursor {
        animation: blink 1s steps(1) infinite;
      }
      .float1 {
        animation: float1 5s ease-in-out infinite;
      }
      .float2 {
        animation: float2 6s ease-in-out infinite;
      }
      .float3 {
        animation: float3 7s ease-in-out infinite;
      }
      .linePulse {
        animation: pulse 3s ease-in-out infinite;
      }
      .shine {
        animation: shine 4s linear infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      @keyframes float1 {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes float3 {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes shine {
        0% { transform: translateX(-120px); opacity: 0; }
        25% { opacity: 0.6; }
        50% { opacity: 0.9; }
        100% { transform: translateX(1100px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)" opacity="0.35"/>

  <!-- Decorative shine -->
  <g class="shine">
    <rect x="0" y="0" width="140" height="320" fill="url(#accent)" opacity="0.08"/>
  </g>

  <!-- Top accent -->
  <rect x="40" y="34" width="260" height="4" rx="2" fill="url(#accent)" class="linePulse"/>

  <!-- Left content -->
  <text x="40" y="70" class="muted">$ whoami</text>
  <text x="40" y="120" class="title">ILHAM FIRMANSYAH</text>
  <text x="40" y="155" class="subtitle">Software Developer • Engineering • Technology</text>
  <text x="40" y="190" class="desc">Terus belajar, membangun solusi, dan berkembang melalui kolaborasi.</text>

  <!-- Mini tags -->
  <g filter="url(#softGlow)">
    <rect x="40" y="220" width="120" height="34" rx="17" fill="#0F172A" stroke="#334155"/>
    <text x="100" y="242" text-anchor="middle" class="terminalText">Clean Code</text>

    <rect x="175" y="220" width="130" height="34" rx="17" fill="#0F172A" stroke="#334155"/>
    <text x="240" y="242" text-anchor="middle" class="terminalText">Problem Solving</text>

    <rect x="320" y="220" width="120" height="34" rx="17" fill="#0F172A" stroke="#334155"/>
    <text x="380" y="242" text-anchor="middle" class="terminalText">Continuous Learning</text>
  </g>

  <!-- Right terminal card -->
  <g class="float1">
    <rect x="700" y="55" width="440" height="210" rx="20" fill="#0B1220" stroke="#263244"/>
    <rect x="700" y="55" width="440" height="34" rx="20" fill="#111827"/>
    <circle cx="726" cy="72" r="6" fill="#EF4444"/>
    <circle cx="746" cy="72" r="6" fill="#F59E0B"/>
    <circle cx="766" cy="72" r="6" fill="#22C55E"/>

    <text x="790" y="77" class="muted">~/profile/terminal</text>

    <text x="725" y="115" class="terminalText">$ status</text>
    <text x="815" y="115" class="terminalText">building meaningful projects...</text>

    <text x="725" y="145" class="terminalText">$ focus</text>
    <text x="805" y="145" class="terminalText">software • systems • collaboration</text>

    <text x="725" y="175" class="terminalText">$ mindset</text>
    <text x="825" y="175" class="terminalText">learn - build - improve</text>

    <text x="725" y="205" class="terminalText">$ skills</text>
    <text x="800" y="205" class="terminalText">python java c/c++ docker github</text>

    <text x="725" y="235" class="terminalText">$ ready_to_collab</text>
    <text x="930" y="235" class="terminalText">true</text>
    <rect x="972" y="222" width="10" height="18" fill="#22C55E" class="cursor"/>
  </g>

  <!-- Floating decorations -->
  <g class="float2" opacity="0.85">
    <circle cx="620" cy="88" r="8" fill="#22C55E"/>
    <circle cx="650" cy="88" r="5" fill="#38BDF8"/>
    <circle cx="675" cy="88" r="3" fill="#A855F7"/>
  </g>

  <g class="float3" opacity="0.7">
    <rect x="600" y="210" width="62" height="10" rx="5" fill="#1E293B"/>
    <rect x="600" y="228" width="96" height="10" rx="5" fill="#1E293B"/>
    <rect x="600" y="246" width="44" height="10" rx="5" fill="#1E293B"/>
  </g>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="26.5" stroke="#1F2937" stroke-width="3"/>
</svg>
